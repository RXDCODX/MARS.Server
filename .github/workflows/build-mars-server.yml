name: Build MARS.Server (server-only)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Directory.Packages.props
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/RXDCODX/MARS/contents/Directory.Packages.props \
            --jq '.content' | base64 -d > Directory.Packages.props
          head -5 Directory.Packages.props

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MARS.Server.csproj -p:HUSKY=0 -p:UseLocalYoutubeReExplode=false

      - name: Build (skip frontend/publish targets)
        run: dotnet build MARS.Server.csproj -c Release --no-restore -p:HUSKY=0 -p:UseLocalYoutubeReExplode=false -p:TreatWarningsAsErrors=false

      # Важно: не вызываем dotnet publish, чтобы не срабатывали BeforeTargets/AfterTargets "Publish"
      # из csproj (они запускают yarn и сборку фронта). Нам нужна лишь проверка успешной сборки бэкенда.
