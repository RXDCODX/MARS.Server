name: Build MARS

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Assemble project structure
        run: |
          mkdir -p MARS.Projects/MARS.Server
          rsync -a --exclude='.git' --exclude='MARS.Projects' --exclude='_monorepo' ./ MARS.Projects/MARS.Server/
          cp -r _monorepo/MARS.Projects/MARS.Shared MARS.Projects/MARS.Shared
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MARS.Projects/MARS.Server/MARS.Server.csproj -p:HUSKY=0 -p:UseLocalYoutubeReExplode=false

      - name: Build (skip frontend/publish targets)
        run: dotnet build MARS.Projects/MARS.Server/MARS.Server.csproj -c Release --no-restore -p:HUSKY=0 -p:UseLocalYoutubeReExplode=false -p:TreatWarningsAsErrors=false

      - name: Publish (for autotests artifact)
        run: |
          dotnet publish MARS.Projects/MARS.Server/MARS.Server.csproj \
            -c Release \
            -o publish-output \
            -p:UseLocalYoutubeReExplode=false \
            -p:RunTestsOnPublish=false \
            -p:SkipHusky=true \
            -p:SkipBuildClient=true

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish-output/
          retention-days: 7

      # --- Генерация OpenAPI-схем ---

      - name: Generate OpenAPI schemas
        run: |
          mkdir -p mars.client/api
          ASPNETCORE_ENVIRONMENT=Development \
          ConnectionStrings__Dev_Path="Host=localhost;Database=dummy;Username=dummy;Password=dummy" \
          AppSettings__Telegram__BotConfiguration__BotToken="dummy" \
          AppSettings__Telegram__AdminIdsArray__0="0" \
          dotnet publish-output/MARS.Server.dll --generate-openapi
          if [ ! -f mars.client/api/swagger_api.json ] || [ ! -f mars.client/api/swagger_hubs.json ]; then
            echo "ERROR: OpenAPI schemas not generated!"
            exit 1
          fi
          echo "=== Generated swagger files ==="
          ls -la mars.client/api/

      - name: Upload swagger schemas
        uses: actions/upload-artifact@v4
        with:
          name: swagger-schemas
          path: |
            mars.client/api/swagger_api.json
            mars.client/api/swagger_hubs.json
          retention-days: 7

  build-frontend:
    name: Build Frontend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: "22.x"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Init mars.client submodule
        run: |
          cd _monorepo
          git submodule update --init MARS.Projects/mars.client

      - name: Enable yarn via corepack
        run: corepack enable && corepack prepare yarn@4.14.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: _monorepo/MARS.Projects/mars.client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: _monorepo/MARS.Projects/mars.client

      # --- Проверка актуальности сгенерированных API-клиентов ---

      - name: Download swagger schemas
        uses: actions/download-artifact@v4
        with:
          name: swagger-schemas
          path: _monorepo/MARS.Projects/mars.client/api/

      - name: Verify API clients are up-to-date
        run: |
          cd _monorepo/MARS.Projects/mars.client
          cp -r src/shared/api src/shared/api-checked-in
          yarn build:api
          # build-api.js вызывает Prettier через PowerShell — на Linux это не работает.
          # Форматируем явно, чтобы сгенерированные файлы совпадали с закоммиченными.
          yarn prettier --write "src/shared/api/**/*.{ts,tsx}" 2>/dev/null || true
          if ! diff -rq src/shared/api src/shared/api-checked-in > /dev/null 2>&1; then
            echo "❌ Сгенерированные API-файлы отличаются от закоммиченных!"
            echo "Запустите 'yarn build:api' локально и закоммитьте изменения."
            diff -ru src/shared/api-checked-in src/shared/api || true
            exit 1
          fi
          echo "✅ API-файлы актуальны"
          rm -rf src/shared/api-checked-in

      - name: Build frontend
        run: yarn build
        working-directory: _monorepo/MARS.Projects/mars.client

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: _monorepo/MARS.Projects/mars.client/dist/
          retention-days: 7
