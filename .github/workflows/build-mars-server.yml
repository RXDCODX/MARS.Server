name: Build MARS.Server (server-only)

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Assemble project structure
        run: |
          mkdir -p MARS.Projects/MARS.Server
          rsync -a --exclude='.git' --exclude='MARS.Projects' --exclude='_monorepo' ./ MARS.Projects/MARS.Server/
          cp -r _monorepo/MARS.Projects/MARS.Shared MARS.Projects/MARS.Shared
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MARS.Projects/MARS.Server/MARS.Server.csproj -p:HUSKY=0 -p:UseLocalYoutubeReExplode=false

      - name: Build (skip frontend/publish targets)
        run: dotnet build MARS.Projects/MARS.Server/MARS.Server.csproj -c Release --no-restore -p:HUSKY=0 -p:UseLocalYoutubeReExplode=false -p:TreatWarningsAsErrors=false

      - name: Publish (for autotests artifact)
        run: |
          dotnet publish MARS.Projects/MARS.Server/MARS.Server.csproj \
            -c Release \
            -o publish-output \
            -p:UseLocalYoutubeReExplode=false \
            -p:RunTestsOnPublish=false \
            -p:SkipHusky=true \
            -p:SkipBuildClient=true

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish-output/
          retention-days: 7
