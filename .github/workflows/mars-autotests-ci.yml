name: MARS.AutoTests CI

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NODE_OPTIONS: "--max-old-space-size=4096"
  HUSKY: 0

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Сборка бэкенда (dotnet publish)
  # ────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      - name: Init MARS.Server submodules
        run: git submodule update --init --recursive

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Init monorepo submodules
        run: |
          cd _monorepo
          git config submodule.MARS.Projects/MARS.AudioController.url https://github.com/RXDCODX/MARS.AudioController.git
          git submodule update --init MARS.Projects/MARS.AudioController

      - name: Assemble project structure
        run: |
          mkdir -p MARS.Projects/MARS.Server
          rsync -a --exclude='.git' --exclude='MARS.Projects' ./ MARS.Projects/MARS.Server/
          cp -r _monorepo/MARS.Projects/MARS.AudioController MARS.Projects/MARS.AudioController 2>/dev/null || true
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true
          cp _monorepo/.editorconfig .editorconfig 2>/dev/null || true
          cp _monorepo/appsettings.Production.json appsettings.Production.json
          cp _monorepo/appsettings.Staging.json appsettings.Staging.json 2>/dev/null || true
          cp _monorepo/appsettings.json appsettings.json 2>/dev/null || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: dotnet publish
        run: |
          dotnet publish MARS.Projects/MARS.Server/MARS.Server.csproj \
            -c Release \
            -o publish-output \
            -p:UseLocalYoutubeReExplode=false \
            -p:RunTestsOnPublish=false \
            -p:SkipHusky=true \
            -p:SkipBuildClient=true

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish-output/
          retention-days: 1

  # ────────────────────────────────────────────────────────────
  # Job 2: Сборка фронтенда (yarn build)
  # ────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Init monorepo submodules
        run: |
          cd _monorepo
          git submodule update --init MARS.Projects/mars.client

      - name: Enable yarn via corepack
        run: corepack enable && corepack prepare yarn@4.14.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: _monorepo/MARS.Projects/mars.client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: _monorepo/MARS.Projects/mars.client

      - name: Build frontend
        run: yarn build
        working-directory: _monorepo/MARS.Projects/mars.client

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: _monorepo/MARS.Projects/mars.client/dist/
          retention-days: 1

  # ────────────────────────────────────────────────────────────
  # Job 3: DB setup + Server + Autotests
  # ────────────────────────────────────────────────────────────
  run-autotests:
    name: Run AutoTests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build-backend, build-frontend]

    steps:
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Assemble autotest structure
        run: |
          cp -r _monorepo/MARS.Projects/MARS.AutoTests MARS.Projects/MARS.AutoTests
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true
          cp -r _monorepo/Sql_backup Sql_backup

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend-publish/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --- Запуск PostgreSQL ---
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=prod \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=10 \
            postgres:16-alpine

      - name: Wait for PostgreSQL healthy
        run: |
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' postgres 2>/dev/null | grep -q healthy; then
              echo "PostgreSQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become healthy"
          docker logs postgres
          exit 1

      # --- EF Database Update (создаём схему) ---
      - name: EF Database Update
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --context AppDbContext \
            --project MARS.Projects/MARS.Server \
            --no-build \
            -p:UseLocalYoutubeReExplode=false 2>&1 || echo "EF update completed (some migrations may have partial errors)"
        env:
          ASPNETCORE_ENVIRONMENT: Staging

      # --- Restore SQL Backup ---
      - name: Restore SQL backup
        run: |
          LATEST=$(ls -d Sql_backup/VS-snapshot_* 2>/dev/null | sort -r | head -1)
          if [ -z "$LATEST" ]; then
            echo "ERROR: No backup directories found"
            exit 1
          fi
          SQL_FILE=$(find "$LATEST" -maxdepth 1 -name "*.sql" | head -1)
          echo "Restoring: $SQL_FILE"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f "$SQL_FILE" --set ON_ERROR_STOP=off

      # --- Запуск MARS.Server ---
      - name: Start MARS.Server
        run: |
          mkdir -p server-wwwroot
          cp -r backend-publish/* server-wwwroot/
          cp -r frontend-dist/* server-wwwroot/wwwroot/ 2>/dev/null || true
          docker run -d --name mars-server \
            --network host \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e ASPNETCORE_URLS="http://+:9725" \
            -v $(pwd)/server-wwwroot:/app \
            mcr.microsoft.com/dotnet/aspnet:10.0 \
            dotnet /app/MARS.Server.dll

      - name: Wait for server ready
        run: |
          echo "Waiting for MARS.Server on port 9725..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:9725/ > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          docker logs mars-server
          exit 1

      # --- Build + Run AutoTests ---
      - name: Restore .NET (AutoTests)
        run: dotnet restore MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj -p:UseLocalYoutubeReExplode=false

      - name: Build .NET (AutoTests)
        run: dotnet build MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj --configuration Debug --no-restore -p:UseLocalYoutubeReExplode=false -p:TreatWarningsAsErrors=false

      - name: Install Playwright Chromium
        run: pwsh MARS.Projects/MARS.AutoTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run AutoTests
        run: |
          dotnet test MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj \
            --configuration Debug \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=mars-autotests.trx" \
            --results-directory TestResults
        env:
          MARS_SERVER_URL: "http://localhost:9725"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-autotests-results
          path: TestResults/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rm -f mars-server postgres 2>/dev/null || true
