name: MARS.AutoTests CI

on:
  workflow_run:
    workflows: ["MARS.Tests CI"]
    types: [completed]
    branches: [master, develop, feature/*]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  HUSKY: 0

jobs:
  autotests:
    name: MARS.AutoTests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Запускаем только если MARS.Tests CI прошёл успешно (или manual trigger)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Assemble autotest structure
        run: |
          mkdir -p MARS.Projects/MARS.Server
          rsync -a --exclude='.git' --exclude='MARS.Projects' ./ MARS.Projects/MARS.Server/
          cp -r _monorepo/MARS.Projects/MARS.AutoTests MARS.Projects/MARS.AutoTests
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true
          cp -r _monorepo/Sql_backup Sql_backup

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # --- Скачиваем артефакты от билдов ---
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend-publish/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '' }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '' }}

      # --- Собираем сервер с фронтендом в wwwroot ---
      - name: Assemble server with frontend
        run: |
          mkdir -p server-app
          cp -r backend-publish/* server-app/
          mkdir -p server-app/wwwroot
          cp -r frontend-dist/* server-app/wwwroot/

      # --- PostgreSQL + EF Migrations + SQL Restore ---
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=prod \
            -p 5432:5432 \
            --health-cmd="pg_isready -U postgres" \
            --health-interval=5s \
            --health-timeout=3s \
            --health-retries=10 \
            postgres:16-alpine

      - name: Wait for PostgreSQL healthy
        run: |
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' postgres 2>/dev/null | grep -q healthy; then
              echo "PostgreSQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become healthy"
          docker logs postgres
          exit 1

      - name: Restore SQL backup
        run: |
          LATEST=$(ls -d Sql_backup/VS-snapshot_* 2>/dev/null | sort -r | head -1)
          if [ -z "$LATEST" ]; then
            echo "ERROR: No backup directories found"
            exit 1
          fi
          SQL_FILE=$(find "$LATEST" -maxdepth 1 -name "*.sql" | head -1)
          echo "Restoring: $SQL_FILE"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f "$SQL_FILE" --set ON_ERROR_STOP=off

      # --- Запуск MARS.Server ---
      - name: Start MARS.Server
        run: |
          docker run -d --name mars-server \
            --network host \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e ASPNETCORE_URLS="http://+:9725" \
            -v $(pwd)/server-app:/app \
            mcr.microsoft.com/dotnet/aspnet:10.0 \
            dotnet /app/MARS.Server.dll

      - name: Wait for server ready
        run: |
          echo "Waiting for MARS.Server on port 9725..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:9725/ > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          docker logs mars-server
          exit 1

      # --- Сборка и запуск AutoTests ---
      - name: Restore .NET (AutoTests)
        run: dotnet restore MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj -p:UseLocalYoutubeReExplode=false

      - name: Build .NET (AutoTests)
        run: dotnet build MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj --configuration Debug --no-restore -p:UseLocalYoutubeReExplode=false -p:TreatWarningsAsErrors=false

      - name: Install Playwright Chromium
        run: pwsh MARS.Projects/MARS.AutoTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run AutoTests
        run: |
          dotnet test MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj \
            --configuration Debug \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=mars-autotests.trx" \
            --results-directory TestResults
        env:
          MARS_SERVER_URL: "http://localhost:9725"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-autotests-results
          path: TestResults/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker rm -f mars-server postgres 2>/dev/null || true
