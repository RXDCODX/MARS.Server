name: MARS.AutoTests CI

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NODE_OPTIONS: "--max-old-space-size=4096"
  HUSKY: 0

jobs:
  playwright-tests:
    name: MARS.AutoTests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # MARS.Server (сабмодуль) — в корне workspace
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      # Монорепо — отдельно, для тестов, фронтенда и конфигов
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      # Инициализируем только нужные сабмодули
      - name: Init monorepo submodules
        run: |
          cd _monorepo
          git config submodule.MARS.Projects/MARS.AudioController.url https://github.com/RXDCODX/MARS.AudioController.git
          git submodule update --init MARS.Projects/MARS.AudioController
          git submodule update --init MARS.Projects/mars.client

      # Собираем структуру монорепо (Dockerfile ожидает MARS.Projects/MARS.Server/)
      - name: Assemble project structure
        run: |
          mkdir -p MARS.Projects/MARS.Server
          rsync -a --exclude='.git' --exclude='MARS.Projects' ./ MARS.Projects/MARS.Server/
          cp -r _monorepo/MARS.Projects/MARS.AutoTests MARS.Projects/MARS.AutoTests
          cp -r _monorepo/MARS.Projects/mars.client MARS.Projects/mars.client
          cp -r _monorepo/MARS.Projects/MARS.AudioController MARS.Projects/MARS.AudioController 2>/dev/null || true
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true
          cp _monorepo/.editorconfig .editorconfig 2>/dev/null || true
          cp _monorepo/appsettings.Production.json appsettings.Production.json
          cp _monorepo/appsettings.json appsettings.json 2>/dev/null || true
          # Docker Compose файл и SQL бэкапы для AutoTests
          cp _monorepo/docker-compose.autotests.yml docker-compose.autotests.yml
          cp -r _monorepo/Sql_backup Sql_backup

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Enable yarn via corepack
        run: corepack enable && corepack prepare yarn@4.14.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: MARS.Projects/mars.client/yarn.lock

      # --- Docker Compose: postgres + db-restore + mars-server ---
      - name: Docker Compose up
        run: docker compose -f docker-compose.autotests.yml up -d --build

      - name: Wait for server ready
        run: |
          echo "Waiting for MARS.Server on port 9155..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:9155/ > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          docker compose -f docker-compose.autotests.yml logs mars-server
          exit 1

      # --- Сборка тестов ---
      - name: Restore .NET
        run: dotnet restore MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj -p:UseLocalYoutubeReExplode=false

      - name: Build .NET
        run: dotnet build MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj --configuration Debug --no-restore -p:UseLocalYoutubeReExplode=false -p:TreatWarningsAsErrors=false

      # --- Установка Playwright Chromium ---
      - name: Install Playwright Chromium
        run: pwsh MARS.Projects/MARS.AutoTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # --- Запуск тестов ---
      - name: Run AutoTests
        run: |
          dotnet test MARS.Projects/MARS.AutoTests/MARS.AutoTests.csproj \
            --configuration Debug \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=mars-autotests.trx" \
            --results-directory TestResults
        env:
          MARS_SERVER_URL: "http://localhost:9155"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-autotests-results
          path: TestResults/
          retention-days: 30

      - name: Docker Compose down
        if: always()
        run: docker compose -f docker-compose.autotests.yml down -v

      - name: Notify Telegram on failure
        if: failure()
        run: |
          export BOT_TOKEN=$(jq -r '.AppSettings.Telegram.BotConfiguration.BotToken' appsettings.Production.json)
          export ADMIN_ID=$(jq -r '.AppSettings.Telegram.AdminIdsArray[0]' appsettings.Production.json)
          python3 MARS.Projects/MARS.Server/.github/notify-telegram.py "MARS.AutoTests CI" TestResults/mars-autotests.trx
