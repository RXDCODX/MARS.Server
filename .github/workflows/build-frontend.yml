name: Build Frontend

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.x"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      - name: Init mars.client submodule
        run: |
          cd _monorepo
          git submodule update --init MARS.Projects/mars.client

      - name: Enable yarn via corepack
        run: corepack enable && corepack prepare yarn@4.14.1 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: _monorepo/MARS.Projects/mars.client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: _monorepo/MARS.Projects/mars.client

      - name: Build frontend
        run: yarn build
        working-directory: _monorepo/MARS.Projects/mars.client

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: _monorepo/MARS.Projects/mars.client/dist/
          retention-days: 7
