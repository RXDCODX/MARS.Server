name: MARS.Tests CI

on:
  push:
    branches: [master, develop, feature/*]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  HUSKY: 0

jobs:
  unit-tests:
    name: MARS.Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # MARS.Server (сабмодуль) — в корне workspace
      - name: Checkout MARS.Server
        uses: actions/checkout@v4

      # Монорепо — отдельно, только для тестов и конфигов
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: RXDCODX/MARS
          path: _monorepo
          token: ${{ secrets.MONOREPO_PAT }}

      # Инициализируем только нужные сабмодули (MARS.TextToSpeech — orphaned, MARS.Server — свой checkout)
      - name: Init monorepo submodules
        run: |
          cd _monorepo
          git config submodule.MARS.Projects/MARS.AudioController.url https://github.com/RXDCODX/MARS.AudioController.git
          git submodule update --init MARS.Projects/MARS.AudioController

      # Собираем структуру MARS.Projects/ для корректных ProjectReference
      - name: Assemble project structure
        run: |
          mkdir -p MARS.Projects/MARS.Server
          rsync -a --exclude='.git' --exclude='MARS.Projects' --exclude='_monorepo' ./ MARS.Projects/MARS.Server/
          cp -r _monorepo/MARS.Projects/MARS.Tests MARS.Projects/MARS.Tests
          cp -r _monorepo/MARS.Projects/MARS.AudioController MARS.Projects/MARS.AudioController
          cp -r _monorepo/MARS.Projects/MARS.Shared MARS.Projects/MARS.Shared
          cp _monorepo/MARS.sln MARS.sln
          cp _monorepo/Directory.Packages.props Directory.Packages.props
          cp _monorepo/Directory.Build.props Directory.Build.props 2>/dev/null || true
          cp _monorepo/.editorconfig .editorconfig 2>/dev/null || true
          cp _monorepo/appsettings.Production.json appsettings.Production.json
          cp _monorepo/appsettings.json appsettings.json 2>/dev/null || true
          cp _monorepo/coverlet.runsettings coverlet.runsettings

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore MARS.Projects/MARS.Tests/MARS.Tests.csproj -p:UseLocalYoutubeReExplode=false

      - name: Run tests with coverage
        run: |
          dotnet test MARS.Projects/MARS.Tests/MARS.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity normal \
            -p:UseLocalYoutubeReExplode=false \
            -p:TreatWarningsAsErrors=false \
            --logger "trx;LogFileName=mars-tests.trx" \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-tests-results
          path: TestResults/
          retention-days: 30

      - name: Find coverage report
        id: coverage
        run: |
          COVERAGE_XML=$(find TestResults -name "coverage.cobertura.xml" | head -1)
          echo "xml_path=$COVERAGE_XML" >> "$GITHUB_OUTPUT"
          echo "Found coverage report: $COVERAGE_XML"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 30

      - name: Notify coverage report
        if: success() && steps.coverage.outputs.xml_path != ''
        run: |
          export BOT_TOKEN=$(jq -r '.AppSettings.Telegram.BotConfiguration.BotToken' appsettings.Production.json)
          export ADMIN_ID=$(jq -r '.AppSettings.Telegram.AdminIdsArray[0]' appsettings.Production.json)
          python3 MARS.Projects/MARS.Server/.github/notify-telegram.py \
            "MARS.Tests Coverage" \
            --coverage \
            "${{ steps.coverage.outputs.xml_path }}" \
            50 75

      - name: Notify Telegram on failure
        if: failure()
        run: |
          export BOT_TOKEN=$(jq -r '.AppSettings.Telegram.BotConfiguration.BotToken' appsettings.Production.json)
          export ADMIN_ID=$(jq -r '.AppSettings.Telegram.AdminIdsArray[0]' appsettings.Production.json)
          python3 MARS.Projects/MARS.Server/.github/notify-telegram.py "MARS.Tests CI" TestResults/mars-tests.trx
